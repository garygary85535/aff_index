<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AFF 書櫃 · 本地管理</title>
<style>*{box-sizing:border-box}body{margin:0;color:#20354b;background:#f5f7fa;font:15px system-ui}header{padding:18px 24px;background:white;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #dae1e8}h1{font-size:20px;margin:0 auto 0 0}a{color:#185cc4}button,input,select{font:inherit;border:1px solid #c5d1de;border-radius:6px;padding:10px;background:white;color:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}.primary{background:#185cc4;color:white}main{display:grid;grid-template-columns:minmax(260px,35%) 1fr;max-width:1200px;margin:24px auto;gap:22px;padding:0 20px}aside,form{padding:20px;background:white;border:1px solid #dae1e8;border-radius:10px}#search{width:100%}#list{max-height:70vh;overflow:auto;margin-top:12px}#list button{display:block;width:100%;text-align:left;margin-bottom:6px}#list button.active{background:#edf3ff;border-color:#185cc4}small{display:block;color:#65798d;margin-top:4px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:flex;flex-direction:column;gap:6px}.wide{grid-column:1/-1}.actions{display:flex;gap:12px;margin-top:22px;flex-wrap:wrap}#status{padding:12px 24px;margin:0;white-space:pre-wrap}#delete{color:#a33240}input[type=checkbox]{width:20px;height:20px}.check{flex-direction:row;align-items:center}#coverPreview{max-width:100px;max-height:100px;object-fit:contain}@media(max-width:650px){main{grid-template-columns:1fr}#list{max-height:250px}.fields{grid-template-columns:1fr}.wide{grid-column:auto}}
.purchase-row{display:grid;grid-template-columns:minmax(80px,1fr) minmax(120px,2fr) auto;gap:8px;margin-bottom:10px;align-items:end}.purchase-row input{width:100%;min-width:0}.purchase-actions{display:flex;gap:4px}.purchase-actions button{padding:8px}h3{font-size:16px;margin:0 0 12px}@media(max-width:650px){.purchase-row{grid-template-columns:1fr}.purchase-actions{justify-content:flex-end}}
</style>
<header><h1>AFF 書櫃 · 本地管理</h1><a href="/">宇宙書櫃管理</a><a href="/aff-preview/" target="_blank" rel="noopener">預覽 AFF 書櫃</a><button id="reload">重新載入</button><button id="add">新增文章</button><button id="publish" class="primary">發布 AFF 書櫃</button></header>
<p id="status" role="status">載入中…</p><main><aside><input id="search" type="search" placeholder="搜尋篇名、作者"><div id="list"></div></aside>
<form id="form"><h2 id="heading">選擇一篇文章</h2><div class="fields">
<label class="wide">篇名<input id="title" required maxlength="4000"></label>
<label>作品性質<select id="type"><option>原創</option><option>譯作</option><option>不公開</option></select></label><label>作者<input id="author" maxlength="4000"></label>
<label class="wide">AFF 文章連結<input id="url" type="url" required placeholder="https://www.asianfanfics.com/story/view/…"></label>
<label>付費文章<select id="paid"><option>未見付費標示</option><option>是</option><option>部分付費</option></select></label><label>邀請制<select id="invite"><option>否</option><option>是</option></select></label>
<label class="wide">標籤<input id="tags" maxlength="4000"></label>
<section class="wide" aria-label="購買連結"><h3>購買連結</h3><div id="purchaseList"></div><button id="addPurchase" type="button">＋新增購買連結</button><small>每列填寫顯示名稱與 HTTPS 購買網址，可調整順序。</small></section>
<label class="wide">選擇封面圖片<input id="coverFile" type="file" accept="image/jpeg,image/png,image/webp"><small>JPG、PNG 或 WebP，最大 5 MB；儲存時自動縮圖並壓縮。選圖後先預覽，儲存後才套用。</small></label>
<label class="wide">封面路徑<input id="cover" placeholder="assets/covers/文章編號.webp"><small>選擇圖片後會自動填入，也可保留目前路徑。</small><img id="coverPreview" alt="封面預覽" hidden></label>
<label class="wide check"><input id="visible" type="checkbox">顯示於網站（V）</label></div>
<div class="actions"><button class="primary" id="save">儲存到本地</button><button type="button" id="delete">從列表移除</button></div><small>儲存後可先預覽，再按「發布 AFF 書櫃」。付費文章自動標記邀請制。草稿與不公開作品不顯示。</small></form></main>
<script>
'use strict';
const token='__MANAGER_TOKEN__',$=id=>document.getElementById(id);let state,current=null,dirty=false,busy=false,pendingCover=null,imageReading=false;
const map={title:'篇名',type:'譯作/原創',author:'作者',url:'連結',paid:'付費文章',invite:'邀請制',tags:'標籤',cover:'封面'};
const idOf=s=>new URL(s['連結']).pathname.match(/\/view\/(\d+)/)?.[1];
const status=text=>$('status').textContent=text;
async function api(name,data){const r=await fetch('/api/aff/'+name,{method:data?'POST':'GET',headers:{'X-Manager-Token':token,...(data?{'Content-Type':'application/json'}:{})},body:data?JSON.stringify(data):undefined});const value=await r.json();if(!r.ok)throw Error(value.error||'操作失敗');return value}
function cover(){if(pendingCover){$('coverPreview').hidden=false;$('coverPreview').src=pendingCover;return}const p=$('cover').value;$('coverPreview').hidden=!/^assets\/covers\/\d+(?:-[a-f0-9]{12})?\.webp$/.test(p);if(!$('coverPreview').hidden)$('coverPreview').src='/aff-preview/'+p}
function purchaseRows(){return [...$('purchaseList').children].map(row=>({name:row.querySelector('[data-name]').value.trim(),url:row.querySelector('[data-url]').value.trim()}))}
function addPurchase(value={name:'',url:''}){
 const row=document.createElement('div');row.className='purchase-row';
 for(const [key,label]of [['name','顯示名稱'],['url','購買網址']]){const wrap=document.createElement('label');wrap.textContent=label;const input=document.createElement('input');input.dataset[key]='';input.value=value[key]||'';input.required=true;input.maxLength=key==='name'?100:2000;input.placeholder=key==='name'?'上篇／全篇購買':'https://…';if(key==='url')input.type='url';wrap.append(input);row.append(wrap)}
 const actions=document.createElement('div');actions.className='purchase-actions';
 for(const [text,label,action]of [['↑','上移購買連結',()=>{if(row.previousElementSibling)row.before(row.previousElementSibling)}],['↓','下移購買連結',()=>{if(row.nextElementSibling)row.nextElementSibling.after(row)}],['移除','移除購買連結',()=>row.remove()]]){const button=document.createElement('button');button.type='button';button.textContent=text;button.setAttribute('aria-label',label);button.onclick=()=>{if(busy||imageReading)return;action();dirty=true};actions.append(button)}
 row.append(actions);$('purchaseList').append(row);
}
$('addPurchase').onclick=()=>{if(busy||imageReading)return;if($('purchaseList').children.length>=30){status('購買連結最多 30 個');return}addPurchase();dirty=true};
$('coverFile').onchange=async()=>{const file=$('coverFile').files[0];if(!file)return;imageReading=true;$('save').disabled=true;try{if(file.size>5*1024*1024||!['image/jpeg','image/png','image/webp'].includes(file.type))throw Error('請選擇 5 MB 以內的 JPG、PNG 或 WebP 圖片');const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(Error('圖片讀取失敗'));reader.readAsDataURL(file)});pendingCover=data;dirty=true;cover();status('封面已預覽，按「儲存到本地」後套用。')}catch(e){$('coverFile').value='';status(e.message)}finally{imageReading=false;$('save').disabled=busy}};
function list(){const q=$('search').value.trim().toLowerCase();$('list').replaceChildren();for(const s of state.catalog.stories){if(![s['篇名'],s['作者']].join(' ').toLowerCase().includes(q))continue;const b=document.createElement('button');b.type='button';b.textContent=s['篇名'];b.classList.toggle('active',current===idOf(s));const small=document.createElement('small');small.textContent=s['作者']+' · '+(s['顯示/不顯示']==='V'&&s['譯作/原創']!=='不公開'&&!s['標籤'].includes('草稿')?'顯示':'隱藏');b.append(small);b.onclick=()=>{if(busy||imageReading||dirty&&!confirm('放棄尚未儲存的修改？'))return;open(s)};$('list').append(b)}}
function open(s){pendingCover=null;$('coverFile').value='';$('purchaseList').replaceChildren();for(const link of s?.['購買連結']||[])addPurchase(link);current=s?idOf(s):null;for(const [id,key]of Object.entries(map))$(id).value=s?.[key]||({type:'原創',paid:'未見付費標示',invite:'否'}[id]||'');$('visible').checked=s?s['顯示/不顯示']==='V':true;$('heading').textContent=s?'編輯文章':'新增文章';$('delete').disabled=!s;dirty=false;cover();list()}
async function load(){state=await api('catalog');open(null);status('共 '+state.catalog.stories.length+' 筆目錄。儲存只更新本地，發布才會更新線上。')}
async function run(task){busy=true;document.querySelectorAll('button,input,select').forEach(b=>b.disabled=true);try{await task()}catch(e){status(e.message)}finally{busy=false;document.querySelectorAll('button,input,select').forEach(b=>b.disabled=false);$('delete').disabled=!current}}
$('form').oninput=()=>{dirty=true;cover()};$('paid').onchange=()=>{if(['是','部分付費'].includes($('paid').value))$('invite').value='是';dirty=true};$('coverPreview').onerror=()=>{$('coverPreview').hidden=true};$('search').oninput=list;
$('add').onclick=()=>{if(imageReading)return;if(!dirty||confirm('放棄尚未儲存的修改？'))open(null)};
$('reload').onclick=()=>{if(imageReading)return;if(!dirty||confirm('放棄尚未儲存的修改？'))run(load)};
$('form').onsubmit=e=>{e.preventDefault();if(imageReading||busy)return;run(async()=>{const story=Object.fromEntries(Object.entries(map).map(([id,key])=>[key,$(id).value.trim()]));story['顯示/不顯示']=$('visible').checked?'V':'';story['購買連結']=purchaseRows();const s=await api('save',{revision:state.revision,id:current,story,coverData:pendingCover});state=s;open(state.catalog.stories.find(a=>a['連結']===story['連結']));status('已儲存到本地並備份舊目錄。可先預覽，再發布。')})};
$('delete').onclick=()=>{if(imageReading)return;if(!current||!confirm('從 AFF 列表移除此文章？會備份目錄，不會刪除 AFF 原文。'))return;run(async()=>{state=await api('save',{action:'delete',confirm:true,id:current,revision:state.revision});open(null);status('已從本地列表移除；尚未發布。')})};
$('publish').onclick=()=>{if(imageReading)return;if(dirty){status('請先儲存目前修改再發布。');return}if(!confirm('將目前已儲存的 AFF 目錄發布到 https://garygary85535.github.io/aff_index/ ？'))return;run(async()=>{status('正在發布，請稍候…');const result=await api('publish',{revision:state.revision,confirm:'publish'});status(result.unchanged?'沒有待發布的變更。':'已推送 '+result.commit.slice(0,7)+'；請等待 GitHub Pages 完成部署。')})};
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});run(load);
</script></html>
